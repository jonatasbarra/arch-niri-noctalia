add_newline = true

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bold blue"

[username]
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold green"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
disabled = false

[nodejs]
symbol = "Node "

[python]
symbol = "Python "

[docker_context]
symbol = "Docker "

[cmd_duration]
min_time = 1000
format = " took [$duration]($style)"
